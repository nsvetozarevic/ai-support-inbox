services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-support-inbox-app
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inbox

  worker:
    image: ai-support-inbox-app
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --verbose --sleep=1 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inbox
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8086:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      node:
        condition: service_healthy
    networks:
      - inbox

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "rm -f public/hot && npm ci && npm run build && exec sleep infinity"
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/public/build/manifest.json"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 180s
    networks:
      - inbox
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - .env.docker.example
      - path: .env.docker.local
        required: false
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-inbox-testing.sh:/docker-entrypoint-initdb.d/init-inbox-testing.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inbox

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inbox

volumes:
  postgres_data:
  node_modules:

networks:
  inbox:
    driver: bridge
